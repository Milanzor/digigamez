<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digigamez — browsercheck</title>
<!-- Relative so it resolves under whatever base the site is deployed at. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!--
  Deliberately written in ES5 with no modules, no CSS custom properties, no
  grid and no clamp(): this page has to be able to run on the very browsers
  it is testing for, otherwise a failure would show up as a blank screen
  instead of a report. Do not "modernise" this file.
-->
<style>
  body{margin:0;background:#0e1741;color:#f9f4e7;
       font-family:Arial,Helvetica,sans-serif;font-size:22px;padding:24px}
  h1{font-size:34px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#9fb0e8;font-size:20px}
  #verdict{padding:18px 22px;border-radius:14px;font-size:30px;font-weight:bold;margin-bottom:22px}
  .ok{background:#1c6b3a;color:#d8f8e4}
  .bad{background:#7d2020;color:#ffdede}
  table{border-collapse:collapse;width:100%;max-width:1100px}
  td{padding:8px 10px;border-bottom:1px solid #2b3a7e;vertical-align:top}
  td.k{color:#9fb0e8;width:320px}
  td.v{font-family:"Courier New",monospace;word-break:break-all}
  .pass{color:#6ee87a;font-weight:bold}
  .fail{color:#ff8a7a;font-weight:bold}
  #ua{background:#060a24;padding:14px;border-radius:10px;
      font-family:"Courier New",monospace;font-size:20px;word-break:break-all;
      max-width:1100px;margin-bottom:24px}
  h2{font-size:26px;margin:26px 0 8px}
</style>
</head>
<body>
<h1>Digigamez browsercheck</h1>
<p class="sub">Open deze pagina op het digibord zelf. Maak er een foto van of lees de regels voor.</p>

<noscript>
  <div id="verdict" class="bad">JavaScript staat UIT in deze browser.<br>
  Digigamez kan dan niet werken. Zet JavaScript aan en herlaad de pagina.</div>
</noscript>

<div id="out"></div>

<h2>Naar het spel</h2>
<p style="font-size:20px"><a href="./" style="color:#ffb224">./ — open Digigamez</a></p>

<script>
(function () {
  var need = [];   // features the game actually depends on
  var info = [];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function add(k, v) { info.push([k, v]); }
  function req(k, ok) { need.push([k, !!ok]); return !!ok; }

  function cssSupports(prop, val) {
    try {
      if (typeof window.CSS !== 'undefined' && CSS.supports) return CSS.supports(prop, val);
    } catch (e) {}
    return false;
  }

  // --- identity -----------------------------------------------------------
  var ua = navigator.userAgent;
  var m = ua.match(/(Edg|EdgA|OPR|Chrome|CriOS|Firefox|Version)\/(\d+)/);
  var engine = m ? m[1] : 'onbekend';
  var major = m ? parseInt(m[2], 10) : 0;
  if (/Edg/.test(ua)) engine = 'Edge';
  else if (/OPR/.test(ua)) engine = 'Opera';
  else if (/Chrome|CriOS/.test(ua)) engine = 'Chrome';
  else if (/Firefox/.test(ua)) engine = 'Firefox';
  else if (/Safari/.test(ua) && /Version/.test(ua)) engine = 'Safari';

  add('Browser (geraden)', engine + ' ' + (major || '?'));
  add('Platform', navigator.platform || '—');
  add('Taal', navigator.language || '—');
  add('Schermgrootte (screen)', screen.width + ' x ' + screen.height);
  add('Venstergrootte (viewport)', (window.innerWidth || 0) + ' x ' + (window.innerHeight || 0));
  add('devicePixelRatio', typeof window.devicePixelRatio === 'undefined' ? '—' : window.devicePixelRatio);
  add('Kleurdiepte', screen.colorDepth + ' bit');
  add('Touch-punten (maxTouchPoints)',
      typeof navigator.maxTouchPoints === 'undefined' ? '—' : navigator.maxTouchPoints);
  add('Touch events aanwezig', ('ontouchstart' in window) ? 'ja' : 'nee');
  add('CPU-kernen', navigator.hardwareConcurrency || '—');

  // --- hard requirements --------------------------------------------------
  // If any of these fail the app cannot run at all.
  req('ES modules (<script type=module>)',
      'noModule' in document.createElement('script'));

  var dynImport = false;
  try { new Function('return import("")'); dynImport = true; } catch (e) { dynImport = false; }
  req('Dynamische import() — lazy loading per spel', dynImport);

  var modernSyntax = false;
  try { new Function('const a=(x=1)=>`${x}`; class B{}; a?.(); let c=null??2;'); modernSyntax = true; }
  catch (e) { modernSyntax = false; }
  req('Moderne JS-syntax (arrow, class, ?., ??)', modernSyntax);

  req('CSS custom properties (--var)', cssSupports('--a', '0'));
  req('CSS clamp() — schaalt de UI op groot scherm', cssSupports('width', 'clamp(1px, 1vmin, 2px)'));
  req('CSS grid', cssSupports('display', 'grid'));
  req('CSS aspect-ratio', cssSupports('aspect-ratio', '1 / 1'));
  req('Pointer Events — alle bediening', !!window.PointerEvent);
  req('ResizeObserver — canvas meeschalen', typeof window.ResizeObserver !== 'undefined');
  req('Canvas 2D', (function () {
    try { return !!document.createElement('canvas').getContext('2d'); } catch (e) { return false; }
  })());
  req('Canvas roundRect() — afgeronde vormen', (function () {
    try {
      var c = document.createElement('canvas').getContext('2d');
      return typeof c.roundRect === 'function';
    } catch (e) { return false; }
  })());
  req('Web Audio — alle geluidseffecten',
      !!(window.AudioContext || window.webkitAudioContext));
  req('localStorage — levelvoortgang bewaren', (function () {
    try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return true; }
    catch (e) { return false; }
  })());

  // --- nice to have -------------------------------------------------------
  var optional = [
    ['Fullscreen API (kioskmodus)',
      !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)],
    ['Wake Lock (scherm niet laten dimmen)', typeof navigator.wakeLock !== 'undefined'],
    ['Meerdere vingers tegelijk (multi-touch 2 spelers)',
      (navigator.maxTouchPoints || 0) >= 2]
  ];

  // --- render -------------------------------------------------------------
  var failed = [];
  for (var i = 0; i < need.length; i++) if (!need[i][1]) failed.push(need[i][0]);

  var html = '';
  html += '<div id="verdict" class="' + (failed.length ? 'bad' : 'ok') + '">';
  if (failed.length) {
    html += 'Deze browser kan Digigamez NIET draaien.<br>' +
            '<span style="font-size:22px;font-weight:normal">' +
            failed.length + ' van de ' + need.length +
            ' vereiste functies ontbreken (zie rood hieronder).</span>';
  } else {
    html += 'Deze browser kan Digigamez draaien.<br>' +
            '<span style="font-size:22px;font-weight:normal">Alle ' + need.length +
            ' vereiste functies zijn aanwezig.</span>';
  }
  html += '</div>';

  html += '<h2>User agent</h2><div id="ua">' + esc(ua) + '</div>';

  html += '<h2>Scherm en apparaat</h2><table>';
  for (i = 0; i < info.length; i++) {
    html += '<tr><td class="k">' + esc(info[i][0]) + '</td><td class="v">' + esc(info[i][1]) + '</td></tr>';
  }
  html += '</table>';

  html += '<h2>Vereist voor Digigamez</h2><table>';
  for (i = 0; i < need.length; i++) {
    html += '<tr><td class="k">' + esc(need[i][0]) + '</td><td class="v ' +
            (need[i][1] ? 'pass">OK' : 'fail">ONTBREEKT') + '</td></tr>';
  }
  html += '</table>';

  html += '<h2>Handig, maar niet verplicht</h2><table>';
  for (i = 0; i < optional.length; i++) {
    html += '<tr><td class="k">' + esc(optional[i][0]) + '</td><td class="v ' +
            (optional[i][1] ? 'pass">OK' : 'fail">ontbreekt') + '</td></tr>';
  }
  html += '</table>';

  document.getElementById('out').innerHTML = html;
})();
</script>
</body>
</html>
