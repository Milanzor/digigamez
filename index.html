<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070f" />
    <meta name="description" content="Vierentwintig Nederlandse ruimtemissies voor kinderen van 2 tot 7 jaar, gemaakt voor een groot touchscreen digibord." />
    <title>Digigamez — Ruimtemissies voor het digibord</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Lets a tablet run the board chromeless from its home screen, the same
         way the laptop runs it fullscreen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Digigamez" />
    <!-- The void is painted here as well as in the stylesheet: the two fonts
         and the module graph are now local, but a cold cache still has a frame
         or two to fill and a white flash on a 75" panel is blinding. -->
    <style>
      html, body { margin: 0; background: #05070f; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="color:#f3ece0;font-family:system-ui;padding:2rem;text-align:center">
        Digigamez heeft JavaScript nodig. Zet het aan in de browser van het bord.
      </p>
    </noscript>
    <script type="module" src="/src/shell/main.js"></script>
  </body>
</html>
